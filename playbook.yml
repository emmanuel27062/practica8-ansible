---
- name: Automatizar los cinco servidores Ubuntu
  hosts: servidores
  become: true

  tasks:
    - name: Actualizar la cache de APT
      ansible.builtin.apt:
        update_cache: true

    - name: Crear el usuario itla
      ansible.builtin.user:
        name: itla
        shell: /bin/bash
        create_home: true
        state: present

    - name: Crear la carpeta app
      ansible.builtin.file:
        path: /home/itla/app
        state: directory
        owner: itla
        group: itla
        mode: "0755"

    - name: Crear el archivo hola.txt
      ansible.builtin.copy:
        dest: /home/itla/app/hola.txt
        content: |
          Hola desde {{ inventory_hostname }}.
          Archivo creado automaticamente con Ansible.
          Practica 8 - Emmanuel Peña.
        owner: itla
        group: itla
        mode: "0644"

    - name: Instalar cowsay y htop
      ansible.builtin.apt:
        name:
          - cowsay
          - htop
        state: present